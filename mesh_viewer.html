<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sailboat STL viewer</title>
<style>
  body { margin:0; overflow:hidden; background:#1e232b; font:13px/1.4 sans-serif; }
  #hud { position:absolute; top:10px; left:10px; color:#cfd6e0;
         background:rgba(0,0,0,.35); padding:8px 12px; border-radius:6px; }
  #info { margin-top:6px; white-space:pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <b>Sailboat viewer</b> &mdash; drop an .stl here or
  <input type="file" id="pick" accept=".stl">
  <label style="margin-left:10px"><input type="checkbox" id="wire"> wireframe</label>
  <div id="info"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader }   from 'three/addons/loaders/STLLoader.js';

const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x1e232b);
const camera   = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1e-3, 1e4);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a4a5a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 9, 4);
scene.add(sun);
scene.add(new THREE.GridHelper(20, 40, 0x7fa8d9, 0x39424e));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let model = null, wire = null;

function setModel(geometry) {
  if (model) { scene.remove(model); scene.remove(wire); }
  geometry.rotateX(-Math.PI/2);          // STL z-up -> viewer y-up
  const box  = new THREE.Box3().setFromBufferAttribute(geometry.attributes.position);
  const size = box.getSize(new THREE.Vector3());
  const ctr  = box.getCenter(new THREE.Vector3());

  model = new THREE.Mesh(geometry,
    new THREE.MeshPhongMaterial({ color:0xd9e2ec }));   // single-sided: dark patches = inward normals
  wire = new THREE.Mesh(geometry,
    new THREE.MeshBasicMaterial({ wireframe:true, color:0x2b6cb0, transparent:true, opacity:.35 }));
  wire.visible = document.getElementById('wire').checked;
  scene.add(model, wire);

  const d = Math.max(size.x, size.y, size.z);
  camera.near = d/200; camera.far = d*200;
  camera.updateProjectionMatrix();
  camera.position.set(ctr.x + d, ctr.y + 0.7*d, ctr.z + 0.9*d);
  controls.target.copy(ctr);

  document.getElementById('info').textContent =
    `tris: ${geometry.attributes.position.count/3}\n` +
    `size (m): x ${size.x.toFixed(2)}   y ${size.y.toFixed(2)}   z ${size.z.toFixed(2)}\n` +
    `red axis = x (bow->stern), green = z (up)`;
}

function readFile(file) {
  const r = new FileReader();
  r.onload = e => setModel(new STLLoader().parse(e.target.result));
  r.readAsText(file);   // ASCII STL, as generated by sailboat_stl.py
}
document.getElementById('pick').addEventListener('change',
  e => e.target.files[0] && readFile(e.target.files[0]));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});
document.getElementById('wire').addEventListener('change',
  e => wire && (wire.visible = e.target.checked));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
